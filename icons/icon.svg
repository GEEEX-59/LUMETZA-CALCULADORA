<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b243e"/>
      <stop offset="50%" stop-color="#061626"/>
      <stop offset="100%" stop-color="#020912"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#51b6ff"/>
      <stop offset="100%" stop-color="#1689e8"/>
    </linearGradient>
    <linearGradient id="lGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#80ccff"/>
      <stop offset="100%" stop-color="#1ea0ff"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe885"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Radial Glow from Center -->
  <circle cx="256" cy="256" r="180" fill="#1689e8" opacity="0.18" filter="url(#glow)"/>

  <!-- Decorative Sun Element in top right -->
  <g transform="translate(360, 140)">
    <circle cx="0" cy="0" r="32" fill="url(#sunGrad)" filter="url(#glow)"/>
    <!-- Solar rays -->
    <path d="M 0 -48 L 0 -38 M 0 48 L 0 38 M -48 0 L -38 0 M 48 0 L 38 0 M -34 -34 L -27 -27 M 34 34 L 27 27 M -34 34 L -27 27 M 34 -34 L 27 -27" stroke="#ffe885" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Stylized Monogram "L" -->
  <g filter="url(#glow)">
    <path d="M 170 120 
             L 225 120 
             C 230 120 234 124 234 129 
             L 234 320 
             C 234 324 237 327 241 327 
             L 340 327 
             C 346 327 350 331 350 337 
             L 350 380 
             C 350 386 346 390 340 390 
             L 170 390 
             C 162 390 156 384 156 376 
             L 156 134 
             C 156 126 162 120 170 120 Z" 
          fill="url(#lGrad)"/>
  </g>

  <!-- Solar Grid Detail inside base of L -->
  <path d="M 175 358 L 332 358" stroke="#061626" stroke-width="3" opacity="0.5"/>
</svg>
